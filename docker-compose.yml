services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentmancer_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/agentmancer_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CLOAK_KEY: ${CLOAK_KEY}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      PHX_SERVER: true
    ports:
      - "4000:4000"
    volumes:
      - app_var:/app/var

volumes:
  pgdata:
  app_var:
